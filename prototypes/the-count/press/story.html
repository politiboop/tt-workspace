<style>

  --panel: 42vw; --strip: 36vh;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); scroll-snap-type: y mandatory; }
body { font-family: var(--serif); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
::selection { background: var(--red-soft); }
button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; }
a { color: inherit; }

.bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--rule); z-index: 40; }

.top { position: fixed; top: 3px; left: 0; right: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); z-index: 30; pointer-events: none; }

.top .brand b { color: var(--ink); font-weight: 500; }
.top .links { display: flex; gap: 20px; flex: 0 0 auto; white-space: nowrap; }
.top .brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 16px; }
.top .links a.caut { color: var(--red); }

.panel { position: fixed; top: 51px; right: 0; bottom: 0; width: var(--panel); padding: 22px 32px 96px 26px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px; background: var(--paper); z-index: 20; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 400 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); flex: 0 0 auto; }
.p-head b { font: 700 44px/1 var(--serif-d); color: var(--ink); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

.p-note[hidden] { display: none; }

.mix-top { font: 400 10.5px/1.4 var(--mono); letter-spacing: .06em; color: var(--ink-2); }
.mix-top b { font-weight: 500; color: var(--ink); }
.mix-rows { display: grid; grid-template-columns: 170px 1fr 26px; gap: 3px 8px; align-items: center; font: 400 10px/1.3 var(--mono); letter-spacing: .04em; color: var(--ink-2); }
.mix-rows .mr-b { height: 6px; background: var(--paper-2); border-radius: 1px; overflow: hidden; }

.frame p { font-size: 16.5px; line-height: 1.55; color: var(--ink-2); font-style: italic; }
.why { margin-top: 22px; max-width: 60ch; border-left: 3px solid var(--red); padding: 4px 0 4px 16px; }
.why .lbl { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
.why p { font-size: 17px; line-height: 1.55; color: var(--ink-2); }

.stepnote { margin-top: 14px; max-width: 60ch; border-left: 3px solid var(--ink-3l); padding: 2px 0 2px 14px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
.stepnote .lbl { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 5px; }

details.notes summary::-webkit-details-marker { display: none; }
details.notes summary::before { content: "+ "; color: var(--red); }
details[open].notes summary::before { content: "\2212  "; }
details.notes .list li { font-size: 14px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; left: 8px; top: 8px; z-index: 50; background: var(--ink); color: var(--paper); padding: 8px 12px; font: 500 11px var(--mono); letter-spacing: .08em; text-decoration: none; transform: translateY(-300%); }
.skip:focus { transform: none; }

section:focus { outline: none; }
.btn.red:focus-visible, .ctl button.is-on:focus-visible { outline-color: var(--ink); }
section a, section button { scroll-margin-block: 72px 110px; }
.ctl { position: fixed; right: 32px; bottom: 22px; max-width: calc(var(--panel) - 58px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 30; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; }

.ctl button:hover { background: var(--ink); color: var(--paper); }
.ctl button.is-on { background: var(--red); border-color: var(--red); color: #fff; }
.ctl span { font: 400 11px var(--mono); color: var(--ink-3); letter-spacing: .06em; margin-left: 8px; }

/* the wall, in ink, with the setup row */
.mk { stroke: var(--ink); stroke-opacity: .15; stroke-width: 2; stroke-linecap: round; transition: stroke-opacity .3s, stroke .3s, stroke-width .3s; transition-delay: var(--d, 0ms); }
.mk.is-past { stroke-opacity: .72; }
.mk.is-lit { stroke: var(--red); stroke-opacity: .85; }
.mk.is-now { stroke: var(--red); stroke-opacity: 1; stroke-width: 3.2; }
.mk.setup { stroke: var(--red); stroke-opacity: .2; }
.mk.setup.is-past { stroke-opacity: .8; }
.halo { fill: var(--red); fill-opacity: .13; stroke: var(--red); stroke-opacity: .55; stroke-width: 1; transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .2s; }
.halo.is-off { opacity: 0; }
.yl { font: 400 10.5px var(--mono); fill: var(--ink-3); letter-spacing: .06em; }
.yl.is-now { fill: var(--red); font-weight: 500; }
.ch { font: 400 9.5px var(--mono); fill: var(--ink-3); letter-spacing: .14em; }
.ch.setup { fill: var(--red); }
.chl { stroke: var(--rule); stroke-width: 1; }
.strip .era { fill: rgba(26,24,19,.025); } .strip .era.alt { fill: rgba(26,24,19,.06); }
.strip .era-lbl { font: 400 10px var(--mono); letter-spacing: .12em; fill: var(--ink-3); }
.strip .dens { fill: var(--ink); opacity: .14; }
.strip .tick { stroke: var(--rule); } .strip .yr { font: 400 10px var(--mono); fill: var(--ink-3); }
.strip .sp { fill: var(--red); }
.strip .ph line { stroke: var(--red); stroke-width: 1.5; } .strip .ph path { fill: var(--red); }
.strip .ph { transition: transform .45s cubic-bezier(.2,.7,.2,1); } .strip .ph.is-off { opacity: 0; }

@media (max-width: 860px) {
  :root { --panel: 0px; }
  .top { padding: 0 16px; height: 40px; white-space: nowrap; }
  .top .links a:not(.caut) { display: none; }
  html { scroll-snap-type: y proximity; }
  section a, section button { scroll-margin-top: calc(var(--strip) + 16px); }
  .panel { top: 0; left: 0; right: 0; bottom: auto; width: auto; height: var(--strip); padding: 46px 16px 10px; border-left: 0; border-bottom: 1px solid var(--rule); gap: 8px; overflow: hidden; }
  .p-head b { font-size: 26px; }
  .mix-rows { display: none; }
  section { padding: calc(var(--strip) + 24px) 20px 110px; }
  h1 { font-size: clamp(34px, 9vw, 48px); } h2 { font-size: clamp(28px, 7.5vw, 40px); } h3 { font-size: clamp(22px, 6.2vw, 30px); }
  .dek, .prose { font-size: 16.5px; }
  .stats { grid-template-columns: repeat(2, auto); }

  .ctl { left: 0; right: 0; bottom: 0; max-width: none; padding: 10px 16px 14px; justify-content: space-between; background: var(--paper); border: 0; border-top: 1px solid var(--rule); border-radius: 0; }
  .ctl span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .mk, .halo, .bar i, .mix-rows .mr-b i, .strip .ph { transition: none; } html { scroll-behavior: auto; } }
</style>

<script type="module">
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const parts = (d) => d.split('-').map(Number);
const longDate = (d) => { const [y, m, day] = parts(d); return `${MONTHS_LONG[m - 1]} ${day}, ${y}`; };
const monthYear = (d) => { const [y, m] = parts(d); return `${MONTHS_LONG[m - 1]} ${y}`; };
const shortMonthYear = (d) => { const [y, m] = parts(d); return `${MONTHS[m - 1]} ${y}`; };
const when = (it) => it.grain === 'day' ? longDate(it.date) : it.grain === 'month' ? monthYear(it.date) : it.date;
const outlet = (t) => { const h = t.split(/:| - /)[0].replace(/\s*\([^)]*\)/g, '').trim(); return h.length > 40 ? h.slice(0, 38) + '…' : h; }; // a parenthetical after the outlet name (a renaming note) stays in the full citation only
const smart = (s) => s.replace(/(^|[\s([{—–-])"/g, '$1“').replace(/"/g, '”').replace(/(\w)'(?=\w)/g, '$1’').replace(/(^|[\s([{“—–-])'/g, '$1‘').replace(/'/g, '’');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inline = (s) => esc(smart(String(s))).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const md = (s) => { let out = '', last = 0; const re = /\[([^\]]+)\]\(([^)\s]+)\)/g; let m; while ((m = re.exec(s))) { out += inline(s.slice(last, m.index)); out += `<a href="${esc(m[2])}" target="_blank" rel="noopener">${inline(m[1])}</a>`; last = m.index + m[0].length; } return out + inline(s.slice(last)); };
const nf = (n) => n.toLocaleString('en-US');
const motionQ = matchMedia('(prefers-reduced-motion: reduce)'); let reduced = motionQ.matches; motionQ.addEventListener('change', (e) => { reduced = e.matches; });
const $ = (id) => document.getElementById(id);
const srcLinks = (ss, extra = '') => `<p class="srcs">${(ss || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.text)}">${esc(outlet(s.text))}<span class="vh">: ${esc(s.text)} (opens in a new tab)</span></a>`).join('')}${extra}</p>`;
const withQ = (page, set = {}, hash = '', drop = []) => { const q = new URLSearchParams(location.search); q.delete('v'); drop.forEach((k) => q.delete(k)); Object.entries(set).forEach(([k, v]) => v == null ? q.delete(k) : q.set(k, v)); const qs = q.toString(); return `${page}${qs ? '?' + qs : ''}${hash}`; };
const dayOf = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +(d.slice(8, 10) || 1));

let D, P = null, TT = {};
// an edition may not have its prologue yet: then the story runs without part one (and its tracker titles are not asked for)
const proLoad = document.documentElement.dataset.prologue === '0' ? Promise.resolve(null) : fetch('story/prologue.json').then((r) => r.ok ? r.json() : null).catch(() => null);
try { [D, [P, TT]] = await Promise.all([fetch('ledger.json').then((r) => r.json()), proLoad.then(async (p) => [p, p ? await fetch('story/tracker-titles.json').then((r) => r.ok ? r.json() : {}).catch(() => ({})) : {}])]); }
catch (e) { $('main').innerHTML = '<p class="pend" style="padding:140px 6vw 0">The ledger could not be loaded. Run build.cjs and serve this folder over http.</p>'; throw e; }
const items = D.items, N = items.length;
// everything about the edition's topic comes from the ledger: chapter names and spans, families, eras, terms and the story's own words
const T = D.topic;
const CHAP = Object.fromEntries(T.chapters.map((c) => [c.key, c]));
const CH = Object.fromEntries(T.chapters.map((c) => [c.key, c.short]));
// short family names for the panel: the lead of each ledger label, with no family reduced to its most loaded word
const FAM_SHORT = Object.fromEntries(T.familyOrder.map((k) => [k, (T.families[k] && T.families[k].short) || k]));
const FAM_LABEL = (k) => (D.families && D.families[k] && D.families[k].label) || (T.families[k] && T.families[k].label) || FAM_SHORT[k] || k;
const FAMILY_ORDER = T.familyOrder.filter((k) => (D.families[k] && D.families[k].count) || !D.families[k]); // families with no acts in this edition stay off the panel

    row(g.items, '', 'data-i');
  }
  svg += `<circle class="halo is-off" id="halo" r="${r}" cx="0" cy="0"/>`;
  $('wall').innerHTML = `<svg viewBox="0 0 ${W} ${y + 4}" preserveAspectRatio="xMinYMin meet" aria-hidden="true">${svg}</svg>`;
  markEls = []; document.querySelectorAll('.mk[data-i]').forEach((el) => { markEls[+el.dataset.i] = el; });
  setupEls = []; document.querySelectorAll('.mk[data-s]').forEach((el) => { setupEls[+el.dataset.s] = el; });
  yearEls = {}; document.querySelectorAll('.yl[data-year]').forEach((el) => { (yearEls[el.dataset.year] = yearEls[el.dataset.year] || []).push(el); });
  halo = $('halo');
  paint();
}

// ── the strip ─────────────────────────────────────────────────────────────
const ERAS = T.eras;
const T0 = dayOf(T.start), T1 = (() => { const [y, m] = parts(D.stats.last); return Date.UTC(y, m, 1); })();
const monthKeys = Object.keys(D.stats.byMonth).sort();
let stripW = 0, playheadEl = null, playheadDate = null;
function buildStrip() {
  const el = $('strip'); const W = el.clientWidth; if (!W) return; stripW = W;
  const narrow = W < 520, H = narrow ? 40 : 48, barTop = narrow ? 9 : 11, barBase = H - 17, spanY = H - 15, tickY = H - 9;
  const x = (t) => Math.round((t - T0) / (T1 - T0) * W);
  let s = '';
  ERAS.forEach((e, i) => { const x0 = x(dayOf(e.from)), x1 = e.to ? x(dayOf(e.to)) : W; s += `<rect class="era${i % 2 ? ' alt' : ''}" x="${x0}" y="0" width="${x1 - x0}" height="${H}"/>`; if (!narrow || (ERAS.length - 1 - i) % 2 === 0) s += `<text class="era-lbl" x="${x0 + 4}" y="9">${esc(e.label.toUpperCase())}</text>`; });
  const max = Math.max(...Object.values(D.stats.byMonth)), span = barBase - barTop;
  for (const m of monthKeys) { const [y, mm] = parts(m); const x0 = x(Date.UTC(y, mm - 1, 1)), x1 = x(Date.UTC(y, mm, 1)), w = Math.max(1, x1 - x0 - 1); const h = Math.round((D.stats.byMonth[m] || 0) / max * span); if (h) s += `<rect class="dens" x="${x0}" y="${barBase - h}" width="${w}" height="${h}"/>`; }
  for (let y = T0 === Date.UTC(START_YEAR, 0, 1) ? START_YEAR : START_YEAR + 1; y <= +D.stats.last.slice(0, 4); y++) { const px = x(Date.UTC(y, 0, 1)); s += `<line class="tick" x1="${px}" x2="${px}" y1="${tickY - 4}" y2="${tickY - 1}"/>`; if (!narrow || y % 2) s += `<text class="yr" x="${px + 2}" y="${H - 1}">${y}</text>`; }
  for (const t of (D.threads || [])) { const x0 = x(dayOf(t.first)), x1 = Math.max(x0 + 6, x(dayOf(t.last))); s += `<rect class="sp" x="${x0}" y="${spanY}" width="${x1 - x0}" height="4" rx="1"><title>${esc(t.title)}</title></rect>`; }
  s += `<g class="ph is-off" id="playhead"><line x1="0" x2="0" y1="0" y2="${H}"/><path d="M-4 0 L4 0 L0 5 Z"/></g>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${s}</svg>`;
  playheadEl = $('playhead'); if (playheadDate) setPlayhead(playheadDate);
}
function setPlayhead(d) { playheadDate = d; if (!playheadEl) return; if (!d) { playheadEl.classList.add('is-off'); return; } playheadEl.classList.remove('is-off'); playheadEl.style.transform = `translateX(${Math.round((dayOf(d) - T0) / (T1 - T0) * stripW)}px)`; }

// ── state: what is dark, what is lit, what the panel says ──────────────────
let activeEl = null, shown = 0, countRaf = 0;
const state = { pastItems: new Set(), litItems: new Set(), nowItem: -1, pastSetup: 0, nowSetup: -1, stagger: null };
function paint() {
  markEls.forEach((el, i) => { el.style.setProperty('--d', state.stagger && state.stagger.has(i) ? `${state.stagger.get(i)}ms` : '0ms'); el.classList.toggle('is-past', state.pastItems.has(i)); el.classList.toggle('is-lit', state.litItems.has(i)); el.classList.toggle('is-now', i === state.nowItem); });
  setupEls.forEach((el, j) => { el.classList.toggle('is-past', j < state.pastSetup); el.classList.toggle('is-now', j === state.nowSetup); });
  const c = state.nowItem >= 0 ? centers[state.nowItem] : state.nowSetup >= 0 ? setupCenters[state.nowSetup] : null;
  if (halo) { if (c) { halo.classList.remove('is-off'); halo.style.transform = `translate(${c.x}px, ${c.y}px)`; } else halo.classList.add('is-off'); }
  const yr = state.nowItem >= 0 ? (rowLabelOf(items[state.nowItem]) || String(items[state.nowItem].year)) : null;
  Object.entries(yearEls).forEach(([y, els]) => els.forEach((el) => el.classList.toggle('is-now', y === yr)));
}
function animateCount(to, dur) {
  cancelAnimationFrame(countRaf); const from = shown, t0 = performance.now();
  if (reduced || dur < 50 || from === to) { shown = to; $('p-n').textContent = nf(to); return; }
  const tick = (t) => { const k = Math.max(0, Math.min(1, (t - t0) / dur)); const e = 1 - Math.pow(1 - k, 3); shown = Math.round(from + (to - from) * e); $('p-n').textContent = nf(shown); if (k < 1) countRaf = requestAnimationFrame(tick); };
  countRaf = requestAnimationFrame(tick);
}
function mixRows(rows, topLine) {
  const max = Math.max(1, ...rows.map((r) => r.n));
  $('mix-rows').innerHTML = rows.map((r) => `<span class="mr-l${r.n ? '' : ' is-zero'}">${esc(r.l)}</span><span class="mr-b"><i style="width:${(100 * r.n / max).toFixed(1)}%"></i></span><span class="mr-n${r.n ? '' : ' is-zero'}">${r.n}</span>`).join('');
  $('mix-top').innerHTML = topLine;
}
const famRows = (upto) => { const c = {}; for (let i = 0; i < upto; i++) { const f = items[i].family; c[f] = (c[f] || 0) + 1; } return FAMILY_ORDER.map((k) => ({ l: FAM_SHORT[k], n: c[k] || 0 })); };
const famTop = (rows) => { const top = rows.filter((r) => r.n).sort((a, b) => b.n - a.n).slice(0, 3); return top.length ? `So far · ${top.map((r) => `${esc(r.l)} <b>${r.n}</b>`).join(' · ')}` : 'So far · nothing yet'; };
const secRows = (uptoStep) => SECS.map((s, si) => ({ l: s.title.length > 18 ? s.title.slice(0, 17) + '…' : s.title, n: beats.filter((b, k) => b.si === si && k < uptoStep).length }));
// which count items the prologue has reached so far (its in-count beats), and how many setup marks
const proReached = (uptoStep) => { const past = new Set(), lit = new Set(); let setup = 0; beats.slice(0, uptoStep).forEach((b) => { if (b.item) { past.add(b.item.i); lit.add(b.item.i); } else setup++; }); return { past, lit, setup }; };
const allBeatsReached = () => proReached(beats.length);

function setSection(idx) {
  const s = sections[idx]; if (!s) return; activeEl = s; const kind = s.dataset.kind;
  state.stagger = null; state.litItems = new Set(); state.nowItem = -1; state.nowSetup = -1;
  $('p-note').hidden = !(kind === 'pro-intro' || kind === 'sec' || kind === 'beat');
  let total = '', where = '', n = 0, ph = null;
  if (kind === 'hero') { state.pastItems = new Set(); state.pastSetup = 0; where = 'The story'; n = 0; total = `of ${nf(N)} acts`; mixRows(famRows(0), 'So far · nothing yet'); }
  else if (kind === 'pro-note') { state.pastItems = new Set(); state.pastSetup = 0; where = 'The prologue'; n = 0; total = `of ${nf(N)} acts`; mixRows(famRows(0), 'So far · nothing yet'); }
  else if (kind === 'pro-intro' || kind === 'sec' || kind === 'beat' || kind === 'cautions') {
    const uptoStep = kind === 'pro-intro' ? 0 : kind === 'sec' ? beats.findIndex((b) => b.si === +s.dataset.si) : kind === 'beat' ? +s.dataset.k + 1 : beats.length;
    const r = proReached(Math.max(0, uptoStep)); state.pastItems = r.past; state.litItems = r.lit; state.pastSetup = r.setup;
    if (kind === 'beat') { const b = beats[+s.dataset.k]; if (b.item) state.nowItem = b.item.i; else { state.nowSetup = b.setupIndex; state.pastSetup = Math.max(state.pastSetup - 1, b.setupIndex); } const undated = /^Undated/i.test(b.dateNote || ''); ph = undated ? null : b.date; where = undated ? `${b.section.title} · undated` : `${longDate(b.date)} · ${b.section.title}`; }
    else where = kind === 'cautions' ? 'The prologue · gaps and cautions' : kind === 'sec' ? `${SECS[+s.dataset.si].title}` : 'The prologue';
    n = Math.max(0, uptoStep); total = `of ${beats.length} in the prologue`;
    mixRows(secRows(Math.max(0, uptoStep)), `Prologue · ${Math.max(0, uptoStep)} of ${beats.length}`);
  }
  else if (kind === 'era') {
    const before = +s.dataset.before, after = +s.dataset.after; const r = allBeatsReached(); state.pastSetup = r.setup;
    state.pastItems = new Set(); for (let i = 0; i < after; i++) state.pastItems.add(i);
    state.stagger = new Map(); for (let i = before; i < after; i++) state.stagger.set(i, reduced ? 0 : Math.min(2400, (i - before) * 18));
    where = CH[s.dataset.ch]; n = after; total = `of ${nf(N)} acts`; ph = eraEnd(s.dataset.ch);
    mixRows(famRows(after), famTop(famRows(after)));
  }
  else if (kind === 'thread') {
    // the wall stays where the preceding era left it (ledger order, not dates); the thread's acts are lit even when they lie ahead
    const t = (D.threads || []).find((x) => x.slug === s.dataset.slug); const after = +s.dataset.after; const r = allBeatsReached(); state.pastSetup = r.setup;
    state.pastItems = new Set(); for (let i = 0; i < after; i++) state.pastItems.add(i);
    state.litItems = new Set(t.acts.map((i) => i)); where = `A thread · ${t.title} · ${t.acts.length} acts lit`; n = t.events.length; total = 'moments'; ph = t.first;
    mixRows(famRows(after), famTop(famRows(after)));
  }
  else { const r = allBeatsReached(); state.pastSetup = r.setup; state.pastItems = new Set(items.map((it) => it.i)); where = kind === 'totals' ? 'The totals' : 'The whole count'; n = N; total = 'acts'; mixRows(famRows(N), famTop(famRows(N))); ph = kind === 'end' ? D.stats.last : null; }
  $('p-where').textContent = where; $('p-total').textContent = total;
  if (pendingIdx === idx || pendingIdx >= 0) pendingIdx = -1;
  const h = s.querySelector('h1, h2, h3'); $('live').textContent = h ? `${where}. ${h.innerText.trim().replace(/\s*\n\s*/g, ', ')}` : where;
  animateCount(n, Math.min(1500, Math.abs(n - shown) * 10 + 300));
  const frac = kind === 'hero' ? 0 : (idx) / Math.max(1, sections.length - 1); $('bar').style.width = (100 * frac) + '%';
  setPlayhead(ph); paint();
  history.replaceState(null, '', kind === 'hero' ? location.pathname + location.search : location.search + '#' + s.id);
}
// The active screen is the last one whose top has passed the middle of the viewport. The observer
// watches a band at that height; the scroll handler applies the same rule, so a screen taller than
// the viewport (the cautions, the totals) still takes the panel when it arrives.
// one rule decides the active screen (the last one whose top has passed the middle); the observer only prompts a re-check
const io = new IntersectionObserver(() => pickByScroll(), { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
sections.forEach((s) => io.observe(s));
function pickByScroll() { const mid = innerHeight * 0.5; let idx = -1; for (let i = 0; i < sections.length; i++) { if (sections[i].getBoundingClientRect().top <= mid) idx = i; else break; } if (idx >= 0 && sections[idx] !== activeEl) setSection(idx); }
addEventListener('scroll', pickByScroll, { passive: true });

// ── moving ────────────────────────────────────────────────────────────────
const activeIdx = () => Math.max(0, sections.indexOf(activeEl));
let pendingIdx = -1; // the screen a jump is heading for, so a second key press during the scroll counts from it
const navIdx = () => pendingIdx >= 0 ? pendingIdx : activeIdx();
// focus follows the screen unless a control has it (then the live region announces the change and Pause stays reachable)
const go = (idx, smooth = true) => { idx = Math.max(0, Math.min(sections.length - 1, idx)); const sec = sections[idx]; pendingIdx = idx; sec.scrollIntoView({ behavior: smooth && !reduced ? 'smooth' : 'auto', block: 'start' }); const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('.ctl'))) sec.focus({ preventScroll: true }); };
// a screen taller than the viewport (the cautions, the totals, long steps on a phone) scrolls in parts before the next screen comes
const SLACK = 12; // px of overflow that count as none
const overflowBelow = () => activeEl ? activeEl.getBoundingClientRect().bottom - innerHeight : 0;
const step = (dir) => { const r = activeEl ? activeEl.getBoundingClientRect() : null, b = reduced ? 'auto' : 'smooth'; if (r && dir > 0 && r.bottom > innerHeight + SLACK) { scrollBy({ top: Math.min(innerHeight * .85, r.bottom - innerHeight), behavior: b }); return; } if (r && dir < 0 && r.top < -SLACK) { scrollBy({ top: Math.max(-innerHeight * .85, r.top), behavior: b }); return; } go(navIdx() + dir); };
const next = () => step(1), prev = () => step(-1);
$('next').addEventListener('click', next); $('prev').addEventListener('click', prev);
let timer = 0;
const atEnd = () => activeIdx() >= sections.length - 1 && overflowBelow() <= SLACK;
// Play dwells longer on wordier screens (reading pace of about 3.5 words a second, 7 to 30 seconds), and 9 seconds on each part of a tall one;
// the dwell is read 800 ms after a move so it describes the screen that arrived, and hidden link text is not counted
const visibleWords = (el) => [...el.querySelectorAll('h1, h2, h3, .h-sub, .dek, .prose, .why, .frame, .list, .stat, .cave, .entry, .pend, .stepnote')].map((e) => e.textContent).join(' ').split(/\s+/).filter(Boolean).length;
const dwellFor = () => { if (overflowBelow() > SLACK) return 9000; const words = activeEl ? visibleWords(activeEl) : 0; return Math.max(7000, Math.min(30000, words / 3.5 * 1000)); };
function setPlay(on) {
  clearTimeout(timer); timer = 0;
  $('play').classList.toggle('is-on', on); $('play').textContent = on ? 'Pause' : 'Play';
  if (on) { if (atEnd()) go(0); const after = (fn) => { timer = setTimeout(() => { timer = setTimeout(fn, Math.max(0, dwellFor() - 800)); }, 800); }; const tick = () => { if (atEnd()) { setPlay(false); return; } step(1); after(tick); }; after(tick); }
}
$('play').addEventListener('click', () => setPlay(!timer));
document.addEventListener('click', (e) => { const b = e.target.closest('[data-play]'); if (b) { go(1); setPlay(true); } });
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.matches('input, textarea, select, [contenteditable]')) return;
  if (el && el.closest('a, button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); setPlay(false); go(navIdx() + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlay(false); go(navIdx() - 1); }
  else if (['ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); setPlay(false); step(1); }
  else if (['ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); setPlay(false); step(-1); }
  else if (e.key === 'Escape') setPlay(false);
});
['wheel', 'touchstart'].forEach((ev) => addEventListener(ev, (e) => { if (timer && !(e.target instanceof Element && e.target.closest('.ctl, [data-play]'))) setPlay(false); }, { passive: true }));
$('main').addEventListener('focusin', (e) => { if (timer && !(e.target instanceof Element && e.target.matches('section'))) setPlay(false); });
document.addEventListener('click', (e) => { const a = e.target instanceof Element && e.target.closest('a[href^="#"]'); if (a && timer && !a.closest('.ctl')) setPlay(false); });
document.querySelectorAll('a[data-carry]').forEach((a) => { a.href = a.dataset.carry + location.search; });

// ── go ────────────────────────────────────────────────────────────────────
buildWall(); buildStrip();
// the other readings offer the story first to anyone who has not seen it; opening it is what counts
try { localStorage.setItem('thecount.' + (document.documentElement.dataset.topic || 'corruption') + '.story.seen', new Date().toISOString().slice(0, 10)); } catch {}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { buildWall(); buildStrip(); }, 150); });
const start = location.hash && document.getElementById((() => { const h = location.hash.slice(1); try { return decodeURIComponent(h); } catch { return h; } })());
if (start) { requestAnimationFrame(() => start.scrollIntoView({ behavior: 'auto', block: 'start' })); } else setSection(0);
</script>
